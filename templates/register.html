{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="mb-3 text-center">Đăng ký tài khoản</h4>
            <form method="post">
                <input type="hidden" name="ref" value="{{ ref or '' }}">
                {% if ref %}<div class="alert alert-info py-2 small">Bạn đang đăng ký qua lời mời giới thiệu.</div>{% endif %}
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" placeholder="chữ thường, số, gạch dưới" required autofocus>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" class="form-control" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>Nhập lại mật khẩu</label>
                    <input type="password" name="confirm" class="form-control" minlength="6" required>
                </div>
                {% if captcha_enabled %}
                <div class="form-group">
                    <label>Câu hỏi bảo vệ: <b>{{ captcha_q }}</b></label>
                    <input type="text" name="captcha" class="form-control" placeholder="Nhập kết quả (số nguyên)" required>
                </div>
                {% endif %}
                <button class="btn btn-primary btn-block">Đăng ký</button>
            </form>
            <p class="text-center mt-3 mb-0">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
        </div>
    </div>
</div>
{% endblock %}
