{% extends "base.html" %}
{% block title %}Cấu hình hệ thống{% endblock %}
{% block content %}

<h4 class="mb-3">⚙️ Cấu hình hệ thống</h4>

<div class="card p-4">
    <form method="post">
        <div class="form-group">
            <label>Tên shop</label>
            <input type="text" name="site_name" class="form-control" value="{{ cfg.site_name }}">
        </div>
        <hr>
        <h6>Ngân hàng nhận tiền (dùng để tạo QR nạp ví)</h6>
        <div class="form-group">
            <label>Mã BIN ngân hàng (VD MBBank = 970422)</label>
            <input type="text" name="bank_bin" class="form-control" value="{{ cfg.bank_bin }}">
        </div>
        <div class="form-group">
            <label>Số tài khoản</label>
            <input type="text" name="bank_account_number" class="form-control" value="{{ cfg.bank_account_number }}">
        </div>
        <div class="form-group">
            <label>Tên chủ tài khoản</label>
            <input type="text" name="bank_account_name" class="form-control" value="{{ cfg.bank_account_name }}">
        </div>
        <hr>
        <h6>Thông báo trên trang chủ</h6>
        <div class="form-group">
            <label>Nội dung thông báo (để trống nếu không muốn hiện)</label>
            <textarea name="announcement" class="form-control" rows="2">{{ cfg.announcement }}</textarea>
        </div>
        <hr>
        <h6>SePay Webhook</h6>
        <div class="form-group">
            <label>API Key (đặt giống hệt bên SePay Dashboard → Webhooks → Bảo mật → API Key)</label>
            <input type="text" name="sepay_api_key" class="form-control" value="{{ cfg.sepay_api_key }}">
        </div>
        <p class="text-muted small">
            Webhook URL cần cấu hình bên SePay: <code>{{ webhook_url }}</code>
        </p>
        <button class="btn btn-primary">Lưu cấu hình</button>
    </form>
</div>

{% endblock %}
