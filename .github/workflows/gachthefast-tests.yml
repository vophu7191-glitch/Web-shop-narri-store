name: GachTheFast logic tests

on:
  pull_request:
    paths:
      - "app.py"
      - "gachthefast_logic.py"
      - "tests/**"
      - ".github/workflows/gachthefast-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gachthefast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GachTheFast unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
